<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Blueprint</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Courier New", monospace;
    background-color: #0b3d63;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 24px 24px;
    color: #eaf3fb;
  }
  form {
    border: 1px solid rgba(234, 243, 251, 0.5);
    padding: 2rem 2.5rem;
    min-width: 280px;
    background: rgba(11, 61, 99, 0.6);
  }
  h1 {
    margin: 0 0 1.5rem;
    font-size: 1.1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  label {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
    opacity: 0.8;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 1rem;
    padding: 0.5rem;
    background: transparent;
    border: 1px solid rgba(234, 243, 251, 0.5);
    color: #eaf3fb;
    font-family: inherit;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: 0.6rem;
    background: #eaf3fb;
    color: #0b3d63;
    border: none;
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .error {
    color: #ffb4a2;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <form method="post">
    <h1>Blueprint — Sign in</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
